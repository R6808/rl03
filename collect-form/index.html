<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社团报名</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>社团招新报名</h1>
        <p>找到属于你的舞台</p>
    </header>

    <nav>
        <a href="#intro">报名须知</a>
        <a href="#form">填写报名表</a>
    </nav>

    <main>
        <section id="intro">
            <h2>报名须知</h2>
            <p>欢迎加入我们！请认真填写以下信息。</p>
            <ul>
                <li>报名截止：2026年9月30日</li>
                <li>带 * 的为必填项</li>
            </ul>
        </section>

        <section id="form">
            <h2>报名表单</h2>
            <form action="#" method="get">
                <p>
                    <label for="sname">姓名 <span style="color:red;">*</span></label>
                    <input type="text" id="sname" name="sname" placeholder="请输入真实姓名" required maxlength="20">
                </p>
                <p>
                    <label for="sid">学号 <span style="color:red;">*</span></label>
                    <input type="text" id="sid" name="sid" placeholder="9位数字学号" required pattern="[0-9]{9}" maxlength="9">
                </p>
                <p>
                    <label for="semail">邮箱 <span style="color:red;">*</span></label>
                    <input type="email" id="semail" name="semail" required>
                </p>
                <p>
                    <label for="sphone">手机号 <span style="color:red;">*</span></label>
                    <input type="text" id="sphone" name="sphone" placeholder="13800138000" required pattern="1[3-9][0-9]{9}" maxlength="11">
                </p>
                <p>
                    <label for="sbirth">出生日期</label>
                    <input type="date" id="sbirth" name="sbirth">
                </p>

                <p>性别 <span style="color:red;">*</span></p>
                <p>
                    <label><input type="radio" name="sgender" value="male" checked> 男</label>
                    <label><input type="radio" name="sgender" value="female"> 女</label>
                </p>

                <p>
                    <label for="sdepartment">意向部门 <span style="color:red;">*</span></label>
                    <select id="sdepartment" name="sdepartment" required>
                        <option value="">请选择</option>
                        <option value="tech">技术部</option>
                        <option value="design">设计部</option>
                        <option value="media">新媒体部</option>
                    </select>
                </p>

                <p>技能特长（可多选）</p>
                <p>
                    <label><input type="checkbox" name="sskills" value="html"> HTML</label>
                    <label><input type="checkbox" name="sskills" value="css"> CSS</label>
                    <label><input type="checkbox" name="sskills" value="js"> JavaScript</label>
                </p>

                <p>
                    <label for="sintro">个人简介 <span style="color:red;">*</span></label><br>
                    <textarea id="sintro" name="sintro" rows="4" placeholder="简单介绍一下你自己" required minlength="10" maxlength="200"></textarea>
                </p>

                <p>
                    <button type="submit">提交报名</button>
                    <button type="reset">清空重填</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>社团联合会 · 期待你的加入</p>
    </footer>
</body>
</html>
